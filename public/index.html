<!DOCTYPE html>
<html lang="uz" data-font-size="large">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Futbol - O'yinlar va Jadvallar</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Futbol">

  <!-- Tailwind CSS & Custom CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen">

  <!-- ==================== TOP HEADER ==================== -->
  <header class="sticky top-0 z-40 glass-header px-4 py-3 shadow-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-xl shadow-md shadow-emerald-900/50">
          ⚽
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-tight leading-tight text-white">FUTBOL</h1>
          <p class="text-[11px] font-semibold text-emerald-400">2026/2027 Mavsum • O'yinlar va Jadvallar</p>
        </div>
      </div>

      <!-- Actions: Refresh, Font Resizer & PWA Install -->
      <div class="flex items-center gap-2">
        
        <!-- One-Click Live Refresh Button -->
        <button id="live-refresh-btn" onclick="manualRefresh()" 
          class="p-2 bg-slate-800/90 hover:bg-emerald-600 active:scale-95 text-emerald-400 hover:text-white rounded-xl border border-slate-700 transition flex items-center gap-1.5 text-xs font-bold shadow-md"
          title="Ayni vaqt bo'yicha yangilash">
          <span id="refresh-icon" class="text-base inline-block">🔄</span>
          <span class="hidden sm:inline">Yangilash</span>
        </button>

        <button id="pwa-install-btn" onclick="installPWA()" 
          class="hidden px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1">
          <span>📥</span>
          <span>O'rnatish</span>
        </button>

        <!-- Font Resizer Buttons (Dadamiz uchun qulay) -->
        <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800">
          <button id="font-btn-normal" onclick="applyFontSize('normal')" class="px-2 py-1 text-xs font-bold rounded-lg transition" title="Oddiy shrift">
            A
          </button>
          <button id="font-btn-large" onclick="applyFontSize('large')" class="px-2 py-1 text-sm font-bold rounded-lg transition" title="Katta shrift">
            A+
          </button>
          <button id="font-btn-xlarge" onclick="applyFontSize('xlarge')" class="px-2 py-1 text-base font-black rounded-lg transition" title="Juda katta shrift">
            A++
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-2xl mx-auto px-3.5 py-4 space-y-3.5">

    <!-- 1. League Selector Horizontal Scroll (UZB first) -->
    <section id="league-selector-wrapper" class="overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Chempionatni tanlang:</span>
        <span class="text-xs text-emerald-400 font-semibold">Toshkent vaqti 🇺🇿</span>
      </div>
      <div id="league-tabs-container" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- 2. Round Selector Controls (Oldingi tur / Keyingi tur / Select) -->
    <section id="round-controls-wrapper">
      <!-- Injected via JavaScript -->
    </section>

    <!-- 3. Loading Spinner -->
    <div id="loading-spinner" class="hidden text-center py-12">
      <div class="inline-block w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-slate-400 font-bold mt-3 text-sm">Ma'lumotlar yuklanmoqda...</p>
    </div>

    <!-- 4. Dynamic Content Area -->
    <section id="content-area" class="space-y-4">
      <!-- Dynamic content rendered via app.js -->
    </section>

  </main>

  <!-- ==================== BOTTOM NAVIGATION (4 TABS) ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-header border-t border-slate-800/80 px-2 py-2">
    <div class="max-w-2xl mx-auto grid grid-cols-4 gap-1">
      
      <!-- 1. O'yinlar -->
      <button id="nav-matches" onclick="setTab('matches')" 
        class="flex flex-col items-center justify-center py-1.5 rounded-xl transition text-emerald-400 font-black">
        <span class="text-xl">⚽</span>
        <span class="text-xs mt-0.5">O'yinlar</span>
      </button>

      <!-- 2. Turnir Jadvali -->
      <button id="nav-standings" onclick="setTab('standings')" 
        class="flex flex-col items-center justify-center py-1.5 rounded-xl transition text-slate-400 font-semibold hover:text-slate-200">
        <span class="text-xl">📊</span>
        <span class="text-xs mt-0.5">Jadval</span>
      </button>

      <!-- 3. To'purarlar & Assistlar -->
      <button id="nav-stats" onclick="setTab('stats')" 
        class="flex flex-col items-center justify-center py-1.5 rounded-xl transition text-slate-400 font-semibold hover:text-slate-200">
        <span class="text-xl">🎯</span>
        <span class="text-xs mt-0.5">To'purarlar</span>
      </button>

      <!-- 4. Sevimlilar -->
      <button id="nav-favorites" onclick="setTab('favorites')" 
        class="flex flex-col items-center justify-center py-1.5 rounded-xl transition text-slate-400 font-semibold hover:text-slate-200">
        <span class="text-xl">❤️</span>
        <span class="text-xs mt-0.5">Sevimlilar</span>
      </button>

    </div>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
